name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Core has no platform imports
        run: pnpm run lint:core

      - name: Test (unit, crash, simulator, vectors, CLI, MCP)
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Conformance runner passes against the reference responder
        run: node dist/conformance/cli.js -- node dist/conformance/reference.js
        env:
          ZIMRA_VECTOR_KEY: vectors/test-key.pem

  react-native-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install root SDK dependencies
        run: pnpm install --frozen-lockfile

      - name: Build root SDK
        run: pnpm run build

      - name: Install React Native dependencies
        working-directory: packages/react-native
        run: npm ci --legacy-peer-deps

      - name: Typecheck React Native bindings
        working-directory: packages/react-native
        run: npm run typecheck

      - name: Build React Native bindings
        working-directory: packages/react-native
        run: npm run build
